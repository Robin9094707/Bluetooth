name: RJBluetoothUltra

options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    SWIFT_EMIT_LOC_STRINGS: YES

packages: {}

targets:
  RJBluetoothUltra:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Resources
    resources:
      - path: App/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.rjuhas.bluetoothultra
        PRODUCT_NAME: RJ Bluetooth Ultra
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  RJBluetoothUltra:
    build:
      targets:
        RJBluetoothUltra: all
    run:
      config: Debug
    archive:
      config: Release
